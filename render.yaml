services:
  - type: web
    name: mayavi-cargo-tracker
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: CHROME_EXECUTABLE_PATH
        value: /usr/bin/chromium
