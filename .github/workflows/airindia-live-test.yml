name: Air India production live test
on:
  push:
    branches: [v2-clean-scratch]
    paths:
      - '.github/workflows/airindia-live-test.yml'
  workflow_dispatch:
jobs:
  test-airindia:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Air India production form
        run: |
          set +e
          echo '=== AIR INDIA FORM INSPECT START ==='
          curl -sS --max-time 70 -H 'accept: application/json' \
            -w '\nHTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}\n' \
            'https://mayavi-cargo-shared-tracker.vercel.app/api/airindia-form-debug'
          code=$?
          echo "CURL_EXIT:$code"
          echo '=== AIR INDIA FORM INSPECT END ==='
          exit 0
