name: Build Mayavi Tracker

on:
  push:
    branches: [main, cursor-claude-official-tracker]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Qatar v2 official-site verification
        if: github.head_ref == 'qatar-exact-arrival-fields'
        run: node scripts/smoke-qatar.mjs
