name: Build Mayavi Tracker

on:
  push:
    branches: [main, cursor-claude-official-tracker]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Major carrier official-site smoke tests
        if: github.head_ref == 'major-carriers-live-smoke'
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/smoke-major-carriers.mjs
