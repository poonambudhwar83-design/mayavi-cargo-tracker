name: Fix Virgin Atlantic Exact Flow

on:
  push:
    branches: [v2-clean-scratch]
    paths:
      - '.github/workflows/fix-virgin-exact-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
          fetch-depth: 0

      - name: Patch Virgin exact flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/virgin.js')
          s=p.read_text()

          new_helpers=r'''async function findDocField(page,timeout=15000){
  const end=Date.now()+timeout;
  while(Date.now()<end){
    for(const frame of page.frames()){
      try{
        const handles=await frame.$$('input:not([type="hidden"]):not([type="submit"]):not([type="button"]):not([type="checkbox"]):not([type="radio"])');
        const candidates=[];
        for(const h of handles){
          try{
            const m=await h.evaluate(e=>{
              const r=e.getBoundingClientRect(),st=getComputedStyle(e);
              const own=`${e.placeholder||''} ${e.name||''} ${e.id||''} ${e.getAttribute('aria-label')||''} ${e.title||''}`;
              let label='';
              if(e.id){const l=document.querySelector(`label[for="${CSS.escape(e.id)}"]`);if(l)label=l.innerText||l.textContent||'';}
              const parent=e.closest('label,div,section,form,td');
              const around=parent?(parent.innerText||parent.textContent||''):'';
              return{visible:r.width>10&&r.height>8&&st.display!=='none'&&st.visibility!=='hidden'&&!e.disabled&&!e.readOnly,desc:`${own} ${label} ${around}`.replace(/\s+/g,' ').trim().toLowerCase(),max:e.maxLength||-1};
            });
            if(m.visible)candidates.push({h,m});
          }catch{}
        }
        const exact=candidates.find(x=>/doc\.?\s*no\.?/.test(x.m.desc));
        if(exact)return{frame,handle:exact.h,mode:'doc-no'};
        const awb=candidates.find(x=>/(awb|air\s*waybill|document)/.test(x.m.desc)&&!/prefix/.test(x.m.desc));
        if(awb)return{frame,handle:awb.h,mode:'doc-no'};
        const prefix=candidates.find(x=>/prefix/.test(x.m.desc)||x.m.max===3);
        const number=candidates.find(x=>x!==prefix&&(/number|awb|document/.test(x.m.desc)||x.m.max===8));
        if(prefix&&number)return{frame,prefix:prefix.h,handle:number.h,mode:'split'};
      }catch{}
    }
    await sleep(350);
  }
  return null;
}
async function typeDocNo(page,mawb){
  const digits=digitsOnly(mawb),prefix=digits.slice(0,3),serial=digits.slice(3),field=await findDocField(page,15000);if(!field)return{ok:false};
  const type=async(h,v)=>{
    await h.focus();
    await h.click({clickCount:3}).catch(()=>{});
    await page.keyboard.down('Control').catch(()=>{});await page.keyboard.press('A').catch(()=>{});await page.keyboard.up('Control').catch(()=>{});await page.keyboard.press('Backspace').catch(()=>{});
    await h.type(v,{delay:55});
    await sleep(250);
  };
  if(field.mode==='split'){await type(field.prefix,prefix);await type(field.handle,serial);}else await type(field.handle,digits);
  const value=await field.handle.evaluate(e=>e.value||'').catch(()=> '');
  return{ok:true,mode:field.mode,value,pressedEnter:false};
}
async function waitForTrackingDetails(page,timeout=25000){
  const end=Date.now()+timeout;
  while(Date.now()<end){
    const text=await pageText(page);
    if(/Tracking\s+Details/i.test(text)||/no\s+(?:shipment|result|record)|not\s+found|invalid\s+(?:awb|document|doc)/i.test(text))return text;
    await sleep(500);
  }
  return pageText(page);
}
async function waitForDetailPage(page,timeout=18000){
  const end=Date.now()+timeout;
  while(Date.now()<end){
    const text=await pageText(page);
    if(/Tracking\s+Details/i.test(text)&&/(Origin|Destination|Pieces|Weight|Flight|Status|Booked|Arrived|Received)/i.test(text))return text;
    await sleep(500);
  }
  return pageText(page);
}
'''

          s=re.sub(r'async function findDocField\(page\)\{.*?async function waitForResult\(page,timeout=22000\)\{.*?\}\n',new_helpers,s,flags=re.S)

          old="""    const trackCargo=await clickText(page,[/^Track Cargo$/i,/Track\\s+Cargo/i,/Track\\s+and\\s+trace/i],7000);debug.flow.push({step:'TRACK_CARGO',clicked:Boolean(trackCargo),text:trackCargo});if(trackCargo){await sleep(1300);}\n    const fill=await typeDocNo(page,mawb);debug.flow.push({step:'DOC_NO',...fill});if(!fill.ok)return{ok:false,reason:'VIRGIN ATLANTIC DOC NO FIELD NOT FOUND',officialTracker:URL,debug};\n    const search=await clickText(page,[/^Search$/i,/^Track$/i],7000);debug.flow.push({step:'SEARCH',clicked:Boolean(search),text:search});if(!search)return{ok:false,reason:'VIRGIN ATLANTIC SEARCH BUTTON NOT FOUND',officialTracker:URL,debug};\n    let text=await waitForResult(page,22000);debug.afterSearch=clean(text).slice(0,5000);\n    if(/no\\s+(?:shipment|result|record)|not\\s+found|invalid\\s+(?:awb|document|doc)/i.test(text))return{ok:false,notFound:true,reason:'NOT TRACEABLE ON VIRGIN ATLANTIC CARGO',officialTracker:URL,debug:{...debug,stage:'NO_RECORD'}};\n    const details=await clickText(page,[/^Tracking Details$/i,/Tracking\\s+Details/i],9000);debug.flow.push({step:'TRACKING_DETAILS',clicked:Boolean(details),text:details});if(details){await sleep(1200);text=await waitForResult(page,10000);}else{text=await pageText(page);}\n"""
          new="""    const trackCargo=await clickText(page,[/^Track Cargo$/i],9000);debug.flow.push({step:'TRACK_CARGO',clicked:Boolean(trackCargo),text:trackCargo});if(!trackCargo)return{ok:false,reason:'VIRGIN ATLANTIC TRACK CARGO TILE NOT FOUND',officialTracker:URL,debug};\n    await sleep(1200);await Promise.race([page.waitForNetworkIdle({idleTime:700,timeout:7000}).catch(()=>{}),sleep(7000)]);\n    const fill=await typeDocNo(page,mawb);debug.flow.push({step:'DOC_NO',...fill});if(!fill.ok)return{ok:false,reason:'VIRGIN ATLANTIC DOC NO FIELD NOT FOUND',officialTracker:URL,debug};\n    const search=await clickText(page,[/^Search$/i],9000);debug.flow.push({step:'SEARCH',clicked:Boolean(search),text:search});if(!search)return{ok:false,reason:'VIRGIN ATLANTIC SEARCH BUTTON NOT FOUND',officialTracker:URL,debug};\n    let text=await waitForTrackingDetails(page,25000);debug.afterSearch=clean(text).slice(0,7000);\n    if(/no\\s+(?:shipment|result|record)|not\\s+found|invalid\\s+(?:awb|document|doc)/i.test(text))return{ok:false,notFound:true,reason:'NOT TRACEABLE ON VIRGIN ATLANTIC CARGO',officialTracker:URL,debug:{...debug,stage:'NO_RECORD'}};\n    const details=await clickText(page,[/^Tracking Details$/i,/^Tracking\\s+Details$/i],12000);debug.flow.push({step:'TRACKING_DETAILS',clicked:Boolean(details),text:details});if(!details)return{ok:false,reason:'VIRGIN ATLANTIC TRACKING DETAILS BUTTON NOT FOUND',officialTracker:URL,debug:{...debug,stage:'DETAIL_BUTTON_MISSING',sample:clean(text).slice(0,10000)}};\n    await sleep(1000);text=await waitForDetailPage(page,18000);\n"""
          if old not in s:
              raise SystemExit('Virgin flow anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          Path('.github/workflows/fix-virgin-exact-flow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use exact Virgin Track Cargo search and Tracking Details flow"
          git push origin HEAD:v2-clean-scratch
