name: Qatar Official Tracker Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'lib/adapters/qatar.js'
      - 'lib/official-tracker.js'
      - 'scripts/smoke-qatar.mjs'
      - '.github/workflows/qatar-smoke.yml'
  workflow_dispatch:

jobs:
  qatar-official:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify Qatar official tracking form
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/smoke-qatar.mjs
