name: Mayavi V3 Build

on:
  push:
    branches: [v2-clean-scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
          fetch-depth: 0

      - name: Apply Turkish actual arrival mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/turkish.js')
          s = p.read_text()
          old = "  const arrivalDate = finalLeg?.etaDate || actualArrival?.date || deliveryDate || '';\n  const arrivalTime = finalLeg?.etaTime || actualArrival?.time || deliveryTime || '';"
          new = "  const arrivalDate = actualArrival?.date || finalLeg?.etaDate || '';\n  const arrivalTime = actualArrival?.time || finalLeg?.etaTime || '';"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Turkish arrival mapping block not found')

          old2 = "      arrivalIsActual:false,"
          new2 = "      arrivalIsActual:Boolean(actualArrival?.date),"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit('Turkish arrival actual flag block not found')

          p.write_text(s)
          PY

      - name: Commit Turkish arrival fix if changed
        run: |
          if git diff --quiet -- lib/turkish.js; then
            echo "Turkish arrival mapping already correct"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/turkish.js
            git commit -m "Use Turkish actual ARR event before ETA"
            git push origin HEAD:v2-clean-scratch
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
