name: Mayavi V3 Build

on:
  push:
    branches: [v2-clean-scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
          fetch-depth: 0

      - name: Correct Turkish arrival milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/turkish.js')
          s=p.read_text()

          # Prefer a true ARR event from Turkish status history over a later DLV timestamp.
          merge_start=s.index('function mergeShipment(a,b) {')
          merge_end=s.index('function parseTkSmart(raw, mawb, { loose=false }={}) {', merge_start)
          merge=r'''function mergeShipment(a,b) {
            if (!a) return b;
            if (!b) return a;
            const out = { ...a };
            for (const [k,v] of Object.entries(b)) {
              if ((out[k] === undefined || out[k] === null || out[k] === '') && v !== undefined && v !== null && v !== '') out[k] = v;
            }
            if (b.actualArrivalDate) {
              out.arrivalDate = b.actualArrivalDate;
              out.arrivalTime = b.actualArrivalTime || out.arrivalTime || '';
              out.arrivalIsActual = true;
              out.actualArrivalDate = b.actualArrivalDate;
              out.actualArrivalTime = b.actualArrivalTime || '';
              out.actualArrivalStation = b.actualArrivalStation || out.actualArrivalStation || '';
            }
            if (String(b.status || '').toUpperCase() === 'ARRIVED') out.status = 'ARRIVED';
            out.arrivalIsActual = Boolean(out.arrivalIsActual || a.arrivalIsActual || b.arrivalIsActual);
            return out;
          }

          '''
          s=s[:merge_start]+merge+s[merge_end:]

          # The Turkish reservation table is Flight Date, ETA, ETD, Segment.
          # Use the final flight segment; then override with the actual ARR event when available.
          parse_start=s.index("  const flights = [...s.matchAll(/\\bTK\\s*0*(\\d{2,4})\\b/ig)];")
          parse_end=s.index('  const upper = s.toUpperCase();', parse_start)
          parse=r'''  const flights = [...s.matchAll(/\bTK\s*0*(\d{2,4})\b/ig)];
          let flightNo = flights.length ? `TK${flights.at(-1)[1].padStart(4,'0')}` : '';

          let flightDate = '';
          let scheduledArrivalDate = '';
          let scheduledArrivalTime = '';
          let scheduledDeparture = '';
          let arrivalDate = '';
          let arrivalTime = '';

          const flightRowRe = /\bTK\s*0*(\d{2,4})\b\s+(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}:\d{2})\s+(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}:\d{2})\s+([A-Z]{3})\s*[-–—]\s*([A-Z]{3})/ig;
          const flightRows = [...s.matchAll(flightRowRe)];
          const flightRow = flightRows.at(-1);
          if (flightRow) {
            flightNo = `TK${flightRow[1].padStart(4,'0')}`;
            flightDate = dateOnly(flightRow[2]);
            scheduledArrivalDate = dateOnly(flightRow[3]);
            scheduledArrivalTime = flightRow[4];
            const depDate = dateOnly(flightRow[5]);
            scheduledDeparture = depDate ? `${depDate}T${flightRow[6]}:00` : '';
            arrivalDate = scheduledArrivalDate;
            arrivalTime = scheduledArrivalTime;
            origin = origin || flightRow[7].toUpperCase();
            destination = destination || flightRow[8].toUpperCase();
          }

          let deliveryDate = '';
          let deliveryTime = '';
          let deliveryStation = '';
          const delivered = s.match(/Delivered\s*(?:-|–|—)?\s*([A-Z]{3})?\s*(\d{1,2}\s+[A-Za-z]{3}\s+\d{4}|\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}:\d{2})/i);
          if (delivered) {
            deliveryStation = (delivered[1] || '').toUpperCase();
            deliveryDate = dateOnly(delivered[2]);
            deliveryTime = delivered[3];
          }

          let actualArrivalDate = '';
          let actualArrivalTime = '';
          let actualArrivalStation = '';
          const arrivedEvent = s.match(/\bARR\s+Shipment\s+Arrived\s+([A-Z]{3})\b[\s\S]{0,260}?(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}:\d{2})/i);
          if (arrivedEvent) {
            actualArrivalStation = arrivedEvent[1].toUpperCase();
            actualArrivalDate = dateOnly(arrivedEvent[2]);
            actualArrivalTime = arrivedEvent[3];
            arrivalDate = actualArrivalDate;
            arrivalTime = actualArrivalTime;
            destination = destination || actualArrivalStation;
          }

          const bookingMatch = s.match(/(?:BOOKING\s*DATE|BOOKED\s*(?:ON|AT))\s*[:\-]?\s*(\d{1,2}\s+[A-Za-z]{3}\s+\d{4}|\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}|20\d{2}[.\/-]\d{1,2}[.\/-]\d{1,2})/i);
          const bookedEvent = s.match(/\bBKD\s+Shipment\s+Booked\b[\s\S]{0,240}?(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4})\s+(\d{1,2}:\d{2})/i);
          const bookingDate = bookingMatch ? dateOnly(bookingMatch[1]) : (bookedEvent ? dateOnly(bookedEvent[1]) : '');
          const bookingTime = bookedEvent ? bookedEvent[2] : '';

          '''
          s=s[:parse_start]+parse+s[parse_end:]

          old="""      scheduledDeparture,
      arrivalDate,
      arrivalTime,
      arrivalIsActual:Boolean(deliveryDate && !flightRow),
      deliveryStation,"""
          new="""      scheduledDeparture,
      scheduledArrivalDate,
      scheduledArrivalTime,
      arrivalDate,
      arrivalTime,
      actualArrivalStation,
      actualArrivalDate,
      actualArrivalTime,
      arrivalIsActual:Boolean(actualArrivalDate),
      bookingTime,
      deliveryStation,"""
          if old not in s:
              raise SystemExit('Turkish return milestone block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          print('Turkish ETA, ARR and DLV are now separate')
          PY

      - name: Commit Turkish milestone correction
        run: |
          if git diff --quiet -- lib/turkish.js; then
            echo "No Turkish changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/turkish.js
            git commit -m "Separate Turkish ETA arrival and delivery times"
            git push origin HEAD:v2-clean-scratch
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
