name: Mayavi V3 Build

on:
  push:
    branches: [v2-clean-scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
          fetch-depth: 0
      - name: Apply Turkish TK SMART fix
        run: python3 scripts/patch-turkish-tk-smart.py
      - name: Commit Turkish fix if changed
        run: |
          if git diff --quiet -- lib/turkish.js; then
            echo "No Turkish changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/turkish.js
            git commit -m "Target TK SMART result section for Turkish Cargo"
            git push origin HEAD:v2-clean-scratch
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
