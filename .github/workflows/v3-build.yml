name: Mayavi V3 Build

on:
  push:
    branches: [v2-clean-scratch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
          fetch-depth: 0

      - name: Fix Turkish AWB prefix input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/turkish.js')
          s = p.read_text()

          helper = r'''async function clearAndTypeInput(page, handle, value) {
            await handle.focus();
            await handle.click();
            await page.keyboard.down('Control');
            await page.keyboard.press('A');
            await page.keyboard.up('Control');
            await page.keyboard.press('Backspace');
            await sleep(80);

            let remaining = await handle.evaluate(el => String(el.value || ''));
            if (remaining) {
              await handle.evaluate(el => {
                const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
                if (setter) setter.call(el, ''); else el.value = '';
                el.dispatchEvent(new Event('input', {bubbles:true}));
                el.dispatchEvent(new Event('change', {bubbles:true}));
              });
              await sleep(80);
            }

            await handle.type(String(value), {delay:35});
            await sleep(120);
            return await handle.evaluate(el => String(el.value || ''));
          }

          '''

          if 'async function clearAndTypeInput(page, handle, value)' not in s:
              marker = 'async function fillAddSearch(page, mawb) {'
              s = s.replace(marker, helper + marker, 1)

          old = r'''    if (prefixField) {
              await prefixField.input.click({clickCount:3});
              await page.keyboard.press('Backspace');
              await prefixField.input.type(prefix,{delay:35});
            }
            await numberField.input.click({clickCount:3});
            await page.keyboard.press('Backspace');
            await numberField.input.type(numberField.meta.max === 8 ? serial : (prefixField ? serial : digits),{delay:35});'''

          new = r'''    if (prefixField) {
              const actualPrefix = await clearAndTypeInput(page, prefixField.input, prefix);
              if (actualPrefix !== prefix) return {ok:false,stage:'PREFIX_INPUT_MISMATCH',expectedPrefix:prefix,actualPrefix};
            }
            const wantedNumber = numberField.meta.max === 8 ? serial : (prefixField ? serial : digits);
            const actualNumber = await clearAndTypeInput(page, numberField.input, wantedNumber);
            if (actualNumber !== wantedNumber) return {ok:false,stage:'AWB_INPUT_MISMATCH',expectedNumber:wantedNumber,actualNumber};'''

          if old in s:
              s = s.replace(old, new, 1)
          elif 'const actualPrefix = await clearAndTypeInput' not in s:
              raise SystemExit('Turkish input block not found')

          p.write_text(s)
          print('Turkish prefix clearing is verified before Add')
          PY

      - name: Commit Turkish prefix fix if changed
        run: |
          if git diff --quiet -- lib/turkish.js; then
            echo "No Turkish changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/turkish.js
            git commit -m "Fix Turkish AWB prefix clearing before Add"
            git push origin HEAD:v2-clean-scratch
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
