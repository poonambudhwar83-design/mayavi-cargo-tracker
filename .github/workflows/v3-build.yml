name: Mayavi V3 Build

on:
  push:
    branches: [v2-clean-scratch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-clean-scratch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - name: Package Mayavi source
        uses: actions/upload-artifact@v4
        with:
          name: mayavi-tracker-source
          path: |
            app
            lib
            browser-bridge
            scripts
            package.json
            next.config.js
            vercel.json
            V3.md
          if-no-files-found: error
