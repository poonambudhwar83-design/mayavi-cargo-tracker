name: Probe Qatar Official Tracker

on:
  push:
    branches:
      - probe-qatar-live
    paths:
      - 'scripts/probe-qatar.mjs'
      - '.github/workflows/probe-qatar.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Locate preinstalled Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Probe Qatar public tracking form
        run: node scripts/probe-qatar.mjs
